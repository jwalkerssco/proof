<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E1F3C" />
  <title>Proof</title>
  <meta name="description" content="Proof of visit for field merchandisers." />
  <link rel="apple-touch-icon" href="/proof-icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/proof-icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Proof" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { background: #FFFFFF; color: #16243B; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    button { font-family: inherit; }
    input, select, textarea { font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #0E1F3C; outline-offset: 1px; }
    .pin-input { width: 100%; padding: 12px; border: 1px solid #E4E7EC; border-radius: 12px; font-size: 24px; letter-spacing: 10px; text-align: center; font-family: 'Archivo', Inter, sans-serif; font-weight: 700; color: #16243B; }
    @keyframes proof-pulse { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
    .pulse { animation: proof-pulse 1.4s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>window.onerror=function(m,s,l,c,e){var d=document.createElement("pre");d.style.cssText="position:fixed;inset:0;z-index:99999;background:#fff;color:#b00;font:12px monospace;padding:16px;white-space:pre-wrap;overflow:auto;margin:0";d.textContent="APP ERROR:\n\n"+m+"\n\nline "+l+":"+c+"\n\n"+(e&&e.stack?e.stack:"");document.body.appendChild(d);};window.addEventListener("unhandledrejection",function(ev){window.onerror(String(ev.reason&&ev.reason.message||ev.reason),"",0,0,ev.reason);});</script>
  <script src="/bundle.js"></script>
</body>
</html>
